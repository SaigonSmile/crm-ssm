            border: none;
            border-bottom: 1px solid #e2e2e2;
            background: transparent;
            padding-left: 0;
            padding-right: 0;

<form class="space-y-8" onsubmit="return false;">

<input class="input-underline w-full py-3 text-on-surface text-body-md placeholder:text-secondary-fixed-dim" placeholder="Email công ty" type="email"/>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2 relative">
<label class="text-on-surface-variant text-[12px] uppercase tracking-wider font-semibold">Mật khẩu</label>
<div class="relative flex items-center">
<input class="input-underline w-full py-3 text-on-surface text-body-md placeholder:text-secondary-fixed-dim" placeholder="Mật khẩu" type="password"/>
<button class="absolute right-0 text-secondary hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end">
<a class="text-[#EC7700] text-sm font-medium hover:underline" href="#">Quên mật khẩu?</a>
</div>

<button class="w-full bg-[#EC7700] hover:bg-[#d46a00] text-white py-4 rounded-[12px] text-button uppercase tracking-widest transition-all shadow-md active:scale-[0.98]" type="submit">
