<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/tailwind-config.js"></script>
</head>
<body class="bg-background text-on-background" data-page="customers">
<!-- Persistent Sidebar -->
<div id="sidebar-container"></div>
<!-- Top App Bar -->
<div id="header-container"></div>
<!-- Main Content Canvas -->
<main class="ml-[260px] pt-24 px-margin-desktop pb-12 min-h-screen">
<!-- Header Section -->
<div class="flex justify-between items-center mb-8">
<h2 class="font-headline-lg text-headline-lg text-on-surface">Danh sách khách hàng</h2>
<div class="flex items-center gap-3">
                <button id="import-csv-btn" class="flex items-center gap-2 px-4 py-2 text-secondary border border-outline-variant/50 rounded-lg hover:bg-subtle-grey transition-all card-shadow">
                    <span class="material-symbols-outlined text-[20px]" data-icon="download">download</span>
                    <span class="font-button">Nhập CSV</span>
                </button>
                <button id="export-csv-btn" class="flex items-center gap-2 px-4 py-2 text-secondary border border-outline-variant/50 rounded-lg hover:bg-subtle-grey transition-all card-shadow">
                    <span class="material-symbols-outlined text-[20px]" data-icon="upload">upload</span>
                    <span class="font-button">Xuất CSV</span>
                </button>
<button id="add-customer-btn" class="flex items-center gap-2 px-5 py-2 bg-primary-container text-white rounded-xl shadow-md hover:bg-primary transition-all active:scale-95">
<span class="material-symbols-outlined text-[20px]" data-icon="add">add</span>
<span class="font-button">Thêm khách hàng</span>
</button>
</div>
</div>
<!-- Filter Bar -->
<div class="bg-surface-container-lowest rounded-[20px] p-6 shadow-[0_10px_30px_rgba(0,0,0,0.04)] mb-8 flex flex-wrap items-center gap-4">
<div class="flex-1 min-w-[300px] flex items-center bg-subtle-grey px-4 py-3 rounded-xl border border-outline-variant/10">
<span class="material-symbols-outlined text-secondary mr-3" data-icon="person_search">person_search</span>
<input id="customer-search-input" class="bg-transparent border-none focus:ring-0 text-body-md w-full" placeholder="Tìm theo tên, số điện thoại hoặc email..." type="text"/>
</div>
<div class="flex items-center gap-3">
<select id="customer-segment-filter" class="bg-subtle-grey border-none text-body-sm rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary min-w-[160px]">
<option value="Phân khúc: Tất cả">Phân khúc: Tất cả</option>
<option value="VIP Gold">VIP Gold</option>
<option value="VIP Silver">VIP Silver</option>
<option value="Tiềm năng">Tiềm năng</option>
</select>
<select id="customer-interest-filter" class="bg-subtle-grey border-none text-body-sm rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary min-w-[160px]">
<option value="Sản phẩm: Tất cả">Sản phẩm: Tất cả</option>
<option value="Trẻ hóa da">Trẻ hóa da</option>
<option value="Giảm béo">Giảm béo</option>
<option value="Tắm trắng">Tắm trắng</option>
<option value="Trị nám">Trị nám</option>
</select>
<select id="customer-employee-filter" class="bg-subtle-grey border-none text-body-sm rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary min-w-[160px]">
<option>Nhân viên: Tất cả</option>
</select>
<button class="p-3 text-secondary hover:text-primary transition-colors" onclick="showToast('Áp dụng bộ lọc nâng cao!', 'info')">
<span class="material-symbols-outlined" data-icon="filter_list">filter_list</span>
</button>
</div>
</div>
<!-- Data Table Container -->
<div class="bg-surface-container-lowest rounded-[20px] shadow-[0_10px_30px_rgba(0,0,0,0.04)] overflow-hidden">
<table class="w-full text-left border-collapse">
<thead>
<tr class="border-b border-outline-variant/30 text-secondary font-label-md">
<th class="px-6 py-5 w-12"><input class="rounded border-outline-variant text-primary focus:ring-primary" type="checkbox"/></th>
<th class="px-6 py-5">TÊN KHÁCH HÀNG</th>
<th class="px-6 py-5">CÔNG TY</th>
<th class="px-6 py-5">PHÂN KHÚC</th>
<th class="px-6 py-5">SẢN PHẨM QUAN TÂM</th>
<th class="px-6 py-5">NHÂN VIÊN PTRACH</th>
<th class="px-6 py-5">NGÀY TẠO</th>
<th class="px-6 py-5 text-right">HÀNH ĐỘNG</th>
</tr>
</thead>
<tbody id="customer-table-body" class="divide-y divide-outline-variant/10">
<!-- Dynamic Rows will be injected here by customers.js -->
</tbody>
</table>
<!-- Pagination Container -->
<div id="customer-pagination" class="px-6 py-5 flex justify-between items-center border-t border-outline-variant/30">
<!-- Pagination elements will be dynamically injected -->
</div>
</div>
</main>

    <script src="assets/js/layout.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/modules/import-export.js"></script>
    <script src="assets/js/modules/customers.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if(typeof injectLayout === 'function') {
                await injectLayout('customers');
                if(typeof CustomerModule !== 'undefined') {
                    await CustomerModule.init();
                }
            }
        });
    </script>
</body></html>
