<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Cơ hội bán hàng | Saigon Smile Medical CRM</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="assets/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-background text-on-background font-body-md overflow-hidden" data-page="leads">
    <!-- SideNavBar Anchor -->
    <div id="sidebar-container"></div>
    <!-- TopAppBar Anchor -->
    <div id="header-container"></div>
    
    <!-- Main Content Canvas -->
    <main class="ml-[260px] pt-16 h-screen flex flex-col bg-background">
        <!-- Screen Header -->
        <div class="px-margin-desktop py-8 flex justify-between items-end">
            <div>
                <nav class="flex items-center gap-2 text-label-md text-secondary mb-2">
                    <span class="">CRM</span>
                    <span class="material-symbols-outlined text-[14px]">chevron_right</span>
                    <span class="">Cơ hội bán hàng</span>
                </nav>
                <h2 class="font-headline-lg text-headline-lg text-on-background">Cơ hội bán hàng</h2>
            </div>
            <div class="flex items-center gap-3">
                <button id="filter-lead-btn" class="flex items-center gap-2 px-5 py-2.5 border border-outline-variant/40 rounded-xl text-secondary hover:bg-white transition-all card-shadow">
                    <span class="material-symbols-outlined text-[20px]">filter_list</span>
                    <span class="font-button">Lọc</span>
                </button>
                <button id="add-lead-btn" class="flex items-center gap-2 px-6 py-2.5 bg-primary-container text-white rounded-[12px] font-button shadow-lg shadow-primary-container/20 hover:scale-[1.02] active:scale-95 transition-all">
                    <span class="material-symbols-outlined text-[20px]">add</span>
                    Thêm cơ hội
                </button>
            </div>
        </div>
        <!-- Kanban Board Area -->
        <div class="flex-1 px-margin-desktop pb-8 overflow-x-auto kanban-scroll">
            <div id="kanban-board-container" class="flex gap-gutter h-full min-w-max">
                <!-- Columns will be dynamically injected here by leads.js -->
            </div>
        </div>
    </main>

    <script src="assets/js/layout.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/modules/leads.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if(typeof injectLayout === 'function') {
                await injectLayout('leads');
                if(typeof LeadModule !== 'undefined') {
                    await LeadModule.init();
                }
            }
        });
    </script>
</body>
</html>
